<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:317px;height:331px;background:#FFFFFF;" width="317px" height="331px" viewBox="0 0 317 331" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--entity UC1--><g class="entity" data-qualified-name="UC1" id="ent0001" data-source-line="1"><ellipse cx="153.721" cy="220.554" rx="147.721" ry="94.554" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.5;"/><text x="114.804" y="160.037" fill="#000" font-size="14" textLength="77.834">You can use</text><text x="40.49" y="177.647" fill="#000" font-size="14" textLength="226.461">several lines to define your usecase.</text><text x="63.055" y="195.256" fill="#000" font-size="14" textLength="181.33">You can also use separators.</text><line x1="11.138" y1="198.332" x2="296.303" y2="198.332" style="stroke:#181818;stroke-width:1;"/><text x="53.335" y="216.865" fill="#000" font-size="14" textLength="200.771">Several separators are possible.</text><line x1="7.095" y1="223.942" x2="300.346" y2="223.942" style="stroke:#181818;stroke-width:1;"/><line x1="7.24" y1="225.942" x2="300.201" y2="225.942" style="stroke:#181818;stroke-width:1;"/><text x="82.897" y="242.475" fill="#000" font-size="14" textLength="141.647">And you can add titles:</text><text x="60.848" y="281.694" fill="#000" font-size="14" textLength="179.744">This allows large description.</text><line x1="19.319" y1="258.356" x2="119.09" y2="258.356" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/><text x="119.09" y="263.584" fill="#000" font-size="14" textLength="69.262">Conclusion</text><line x1="188.351" y1="258.356" x2="288.122" y2="258.356" style="stroke:#181818;stroke-width:1;stroke-dasharray:1,2;"/></g><!--entity Writer--><g class="entity" data-qualified-name="Writer" id="ent0002" data-source-line="10"><ellipse cx="1