name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # rockuml measures text with its embedded fonts, which have the metrics of the Windows fonts the goldens
    # were made with, so the parity suite runs on every platform.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy -p rockuml-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: bash tools/build-wasm.sh
      - run: node --test web/rockuml.test.mjs
