name: CI

# Every push to main that passes the tests is published as a pre-release, v<version>-build.<run>; a pushed
# v* tag is published as a release of that name. Pull requests are only tested. Pushes to main also deploy the
# website to GitHub Pages, once the repository is public (Pages needs that, or a paid plan).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    # rockuml measures text with its embedded fonts, which have the metrics of the Windows fonts the goldens
    # were made with, so the parity suite runs on every platform.
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - run: cargo clippy -p rockuml-wasm --target wasm32-unknown-unknown -- -D warnings
      - run: bash tools/build-wasm.sh
      - run: node --test web/rockuml.test.mjs
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Test and build the website
        working-directory: site
        run: |
          npm ci
          npm run format:check
          npm test
          npm run build -- --base-href /rockuml/
          # GitHub Pages answers unknown paths with 404.html, so deep links start the app too.
          cp dist/site/browser/index.html dist/site/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist/site/browser
      # The license texts every package carries, at the paths NOTICE.md and THIRD-PARTY.md link to.
      - name: Collect the licenses
        run: |
          mkdir -p legal/crates/smetana legal/crates/rockuml/assets/fonts
          cp LICENSE COPYING NOTICE.md THIRD-PARTY.md legal/
          cp crates/smetana/LICENSE legal/crates/smetana/
          cp crates/rockuml/assets/fonts/LICENSE-Liberation.txt legal/crates/rockuml/assets/fonts/
          python3 tools/third-party-licenses.py legal/THIRD-PARTY-CRATES.md
      - run: cd web && zip ../rockuml-web.zip index.html package.json rockuml.js rockuml.d.ts rockuml.wasm
      - run: cd legal && zip -r ../rockuml-web.zip . && zip -r ../rockuml-licenses.zip .
      - uses: actions/upload-artifact@v7
        with:
          name: rockuml-web.zip
          path: rockuml-web.zip
      - uses: actions/upload-artifact@v7
        with:
          name: rockuml-licenses.zip
          path: rockuml-licenses.zip

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.repository.private
    needs: [test, wasm]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  build-windows:
    if: github.event_name == 'push'
    needs: [test, wasm]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p rockuml-cli
      - uses: actions/upload-artifact@v7
        with:
          name: rockuml.exe
          path: target/release/rockuml.exe

  build-linux:
    if: github.event_name == 'push'
    needs: [test, wasm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # musl links statically, so the binary runs on any distribution; ring's C code needs musl-gcc.
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release -p rockuml-cli --target x86_64-unknown-linux-musl
      - run: cp target/x86_64-unknown-linux-musl/release/rockuml rockuml-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: rockuml-linux-x86_64
          path: rockuml-linux-x86_64

  build-macos:
    if: github.event_name == 'push'
    needs: [test, wasm]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release -p rockuml-cli --target aarch64-apple-darwin
      - run: cargo build --release -p rockuml-cli --target x86_64-apple-darwin
      - run: >
          lipo -create -output rockuml-macos-universal
          target/aarch64-apple-darwin/release/rockuml
          target/x86_64-apple-darwin/release/rockuml
      - uses: actions/upload-artifact@v7
        with:
          name: rockuml-macos-universal
          path: rockuml-macos-universal

  publish:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Only the release files: the website's artifact goes to GitHub Pages.
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: rockuml*
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes
          else
            version=$(grep -m 1 '^version' Cargo.toml | cut -d '"' -f 2)
            gh release create "v$version-build.$GITHUB_RUN_NUMBER" artifacts/* \
              --target "$GITHUB_SHA" --prerelease --generate-notes \
              --title "rockuml $version build $GITHUB_RUN_NUMBER"
          fi
