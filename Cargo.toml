[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
# A port of PlantUML's LGPL edition; crates/smetana, a port of Graphviz code, is EPL-1.0.
license = "LGPL-3.0-or-later"

[workspace.dependencies]
rockuml = { path = "crates/rockuml" }

[workspace.lints.rust]
# Denied rather than forbidden so that the wasm ABI, where JavaScript hands over raw memory, can allow it.
unsafe_code = "deny"
unused_must_use = "deny"
# Items only the crate uses are `pub(crate)`, so that unused ones show up as dead code.
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
# Ported code reproduces Java's and zlib's numeric semantics, which rely on truncating casts and exact
# float comparisons; flagging every one would bury the warnings that matter.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
float_cmp = "allow"
# Ported tables (colours, zlib codes) are written as in the original sources.
unreadable_literal = "allow"
# zlib's algorithms use single-letter names (n, m, h...) that the port keeps for traceability.
many_single_char_names = "allow"
missing_errors_doc = "allow"

[profile.release]
lto = true
codegen-units = 1
strip = true

# For the web, where the download counts: a quarter smaller, and still fast enough to preview while typing.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
