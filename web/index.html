<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rockuml</title>
<style>
  :root {
    color-scheme: light dark;
    --background: #ffffff;
    --panel: #f4f4f5;
    --text: #18181b;
    --muted: #71717a;
    --border: #d4d4d8;
    --error: #b91c1c;
    --error-background: #fef2f2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #18181b;
      --panel: #27272a;
      --text: #f4f4f5;
      --muted: #a1a1aa;
      --border: #3f3f46;
      --error: #fca5a5;
      --error-background: #450a0a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    grid-template-rows: auto 1fr;
    background: var(--background);
    color: var(--text);
    font: 14px/1.4 system-ui, sans-serif;
  }
  header {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 16px;
    align-items: center;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header h1 { margin: 0 auto 0 0; font-size: 16px; }
  header label { display: flex; gap: 6px; align-items: center; }
  button, select { font: inherit; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); min-height: 0; }
  @media (max-width: 720px) { main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; } }
  textarea {
    width: 100%;
    height: 100%;
    padding: 12px 16px;
    border: 0;
    border-right: 1px solid var(--border);
    resize: none;
    background: var(--background);
    color: var(--text);
    font: 13px/1.5 ui-monospace, Consolas, monospace;
    tab-size: 2;
  }
  #output { display: flex; flex-direction: column; min-height: 0; }
  #message { padding: 8px 16px; color: var(--error); background: var(--error-background); white-space: pre-wrap; }
  #message:empty { display: none; }
  #preview { flex: 1; overflow: auto; padding: 16px; }
  #preview img { display: block; max-width: none; background: #ffffff; }
  #status { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>rockuml</h1>
  <span id="status">Loading rockuml.wasm…</span>
  <label>Format
    <select id="format">
      <option value="svg">SVG</option>
      <option value="png">PNG</option>
    </select>
  </label>
  <label>Page <select id="page"><option value="0">1</option></select></label>
  <button id="download" type="button" disabled>Download</button>
</header>
<main>
  <textarea id="source" spellcheck="false" aria-label="PlantUML source">@startuml
title Ordering a pizza
actor Customer
participant "Web shop" as Shop
database Kitchen

Customer -> Shop : choose pizza
activate Shop
Shop -> Kitchen : place order
Kitchen --> Shop : ready in 20 minutes
Shop --> Customer : confirmation
deactivate Shop

note over Customer, Shop
  Edit this text: the
  diagram follows as you type.
end note
@enduml
</textarea>
  <section id="output" aria-live="polite">
    <div id="message"></div>
    <div id="preview"></div>
  </section>
</main>
<script type="module">
import { load } from './rockuml.js';

const RENDER_DELAY_MS = 250;
const MEDIA_TYPES = { svg: 'image/svg+xml', png: 'image/png' };

const source = document.getElementById('source');
const format = document.getElementById('format');
const page = document.getElementById('page');
const download = document.getElementById('download');
const status = document.getElementById('status');
const message = document.getElementById('message');
const preview = document.getElementById('preview');

let image = null;
// Later edits overtake renderings still under way, whose results are then dropped.
let latestRendering = 0;
let pendingRender;

let rockuml;
try {
  rockuml = await load();
  status.textContent = '';
  render();
} catch (error) {
  status.textContent = `Cannot load rockuml.wasm: ${error.message}. Build it with tools/build-wasm.sh.`;
}

source.addEventListener('input', () => {
  clearTimeout(pendingRender);
  pendingRender = setTimeout(render, RENDER_DELAY_MS);
});
format.addEventListener('change', render);
page.addEventListener('change', render);
download.addEventListener('click', () => {
  const link = document.createElement('a');
  link.href = image.url;
  link.download = image.fileName;
  link.click();
});

async function render() {
  const rendering = ++latestRendering;
  const options = { format: format.value, page: Number(page.value) };
  let result;
  try {
    result = await rockuml.render(source.value, options);
  } catch (error) {
    if (rendering !== latestRendering) {
      return;
    }
    const pageCount = error.pageCount ?? 0;
    showPages(pageCount);
    if (options.page >= pageCount && pageCount > 0) {
      // The edit removed the page shown; showPages picked the last one instead.
      render();
    } else {
      show(null, error.message);
    }
    return;
  }
  if (rendering !== latestRendering) {
    return;
  }
  showPages(result.pageCount);
  const fileName = `diagram${options.page === 0 ? '' : `_${String(options.page).padStart(3, '0')}`}.${options.format}`;
  const blob = new Blob([result.data], { type: MEDIA_TYPES[options.format] });
  show({ url: URL.createObjectURL(blob), fileName }, result.isError ? 'The diagram has errors.' : '');
}

function show(newImage, text) {
  if (image) {
    URL.revokeObjectURL(image.url);
  }
  image = newImage;
  message.textContent = text;
  download.disabled = !image;
  preview.replaceChildren();
  if (image) {
    const element = document.createElement('img');
    element.src = image.url;
    element.alt = 'Rendered diagram';
    preview.append(element);
  }
}

function showPages(count) {
  if (page.options.length === Math.max(count, 1)) {
    return;
  }
  const selected = Math.min(Number(page.value), Math.max(count - 1, 0));
  page.replaceChildren(...Array.from({ length: Math.max(count, 1) }, (_, index) => new Option(index + 1, index)));
  page.value = selected;
}
</script>
</body>
</html>
